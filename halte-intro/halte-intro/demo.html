<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo — Halte Menuju Dunia Saya</title>
<link rel="stylesheet" href="halte-intro.css">
<style>
:root{--color-hero-bg:#14211C;--color-primary:#315C37;--color-primary-hover:#264A2B;--color-accent-path:#84A950;--color-accent-path-light:#A7C66A}
*{box-sizing:border-box}body{margin:0;background:#F6F7F2;color:#14211C;font-family:system-ui,"Nunito",sans-serif}
.hero{background:var(--color-hero-bg);color:#F0F4F1;min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:8vw}
.hero>*{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
html.hi-done .hero>*{opacity:1;transform:none}
html.hi-done .hero>:nth-child(2){transition-delay:.1s}html.hi-done .hero>:nth-child(3){transition-delay:.2s}html.hi-done .hero>:nth-child(4){transition-delay:.3s}
.hero h2{margin:0;color:#FEF08A}.hero h1{margin:0;font-size:clamp(34px,7vw,72px);line-height:1.05}.hero p{margin:0;color:#9BB0A3;max-width:34em}
.hero a{align-self:flex-start;background:#315C37;color:#F0F4F1;padding:14px 28px;border-radius:999px;text-decoration:none;font-weight:800;border:1.5px solid #84A950}
button.rp{margin:24px 8vw;padding:10px 16px;border-radius:999px;border:1.5px solid #284036;background:#1B2C25;color:#F0F4F1;cursor:pointer;font:inherit;font-weight:700}
</style>
<!-- data-auto: intro jalan otomatis & halaman disembunyikan sampai intro selesai (tanpa berkedip) -->
<script src="halte-intro.js" data-auto></script>
</head><body>
<main class="hero"><h2>Hai, aku Mirza!</h2><h1>Muhammad Mirza Wibisono</h1><p>Mahasiswa Perencanaan Wilayah dan Kota, ITS Surabaya — kota, data spasial, dan transportasi.</p><a href="#">Lihat Karya</a></main>
<button class="rp" onclick="HalteIntro.replay()">Putar ulang intro</button>
</body></html>
